name: Release

# On a version tag (v1.2.3): test, pack, attach the tarball to a GitHub release, and publish to npm when the
# NPM_TOKEN repository secret is set.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Check tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm run typecheck
      - run: npm test
      - run: npm pack # prepack builds dist/
      - name: Create GitHub release
        run: gh release create "${GITHUB_REF_NAME}" strands-lambda-durable-*.tgz --title "${GITHUB_REF_NAME}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        run: npm publish strands-lambda-durable-*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
